<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Tugas</title>
    <!-- 1. Sambungkan CDN Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

    <!-- 2. Card container di tengah layar (mx-auto) -->
    <div class="card mx-auto p-4 shadow-sm" style="max-width: 450px;">
        <h3 class="text-center text-primary mb-4">Daftar Siswa Kelompok 4</h3>
        
        <!-- 3. Kolom input dan tombol Tambah di sampingnya -->
        <div class="input-group mb-3">
            <input type="text" id="inputTugas" class="form-control" placeholder="Ketik tugas baru di sini...">
            <button id="btnTambah" class="btn btn-primary">Tambah</button>
        </div>

        <!-- 4. Area div penampung daftar tugas -->
        <div id="areaArray">
            <p class="text-center text-muted">Belum ada tugas hari ini...</p>
        </div>
    </div>

    <!-- 5. Panggil file script.js sebelum penutup body -->
    <script src="script.js"></script>
</body>
</html>
